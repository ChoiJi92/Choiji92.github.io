<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>할렐루양 소그룹 초대</title>
<meta name="description" content="할렐루양에서 함께 기도하는 소그룹에 초대받았어요. 초대 코드로 참여해 주세요.">
<!-- 링크 미리보기 (카카오톡·문자·SNS). 크롤러는 스크립트를 돌리지 않으므로 방마다 달라지지 않는 공통 문구다 -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="할렐루양">
<meta property="og:title" content="할렐루양 소그룹에 초대받았어요">
<meta property="og:description" content="함께 기도하는 소그룹이에요. 초대 코드로 참여해 주세요.">
<meta property="og:image" content="https://choiji92.github.io/join/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://choiji92.github.io/join/">
<meta name="twitter:card" content="summary_large_image">
<meta name="apple-itunes-app" content="app-id=6812377795">
<link rel="icon" href="../img/halleluyang.png">
<style>
  @font-face { font-family: Neo; src: url(NeoDunggeunmo.ttf) format("truetype"); font-display: swap; }
  :root { --text: #15171A; --muted: #4A5460; --card: #FFFFFF; --chip: #EEF1F4; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: linear-gradient(180deg, #9FCDF2 0%, #CFE7FA 55%, #EAF5FD 100%) fixed;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 440px; margin: 0 auto; padding: 48px 20px calc(40px + env(safe-area-inset-bottom)); text-align: center; }
  .jesus { width: 150px; image-rendering: pixelated; display: block; margin: 0 auto -8px; }
  .card { background: var(--card); border-radius: 28px; padding: 28px 22px 24px; box-shadow: 0 10px 30px rgba(30, 60, 100, .12); }
  .brand { display: inline-flex; align-items: center; gap: 10px; font-family: Neo, sans-serif; font-size: 18px; }
  .brand img { width: 36px; height: 36px; border-radius: 9px; }
  h1 { font-family: Neo, sans-serif; font-weight: 400; font-size: 30px; line-height: 1.3; margin: 18px 0 8px; letter-spacing: -0.5px; word-break: keep-all; }
  .sub { color: var(--muted); margin: 0 0 22px; font-size: 16px; line-height: 1.5; word-break: keep-all; }
  .code { background: var(--chip); border-radius: 18px; padding: 16px 12px 14px; margin-bottom: 20px; }
  .code small { display: block; color: var(--muted); font-size: 13px; margin-bottom: 6px; }
  .code strong { font-family: Neo, ui-monospace, monospace; font-weight: 400; font-size: 36px; letter-spacing: 2px; }
  .btn { display: flex; align-items: center; justify-content: center; min-height: 54px; border-radius: 999px; font-size: 17px; font-weight: 700; text-decoration: none; margin-top: 10px; }
  .primary { background: var(--text); color: #fff; }
  .secondary { background: var(--chip); color: var(--text); }
  .note { color: var(--muted); font-size: 13px; line-height: 1.6; margin: 18px 0 0; word-break: keep-all; }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <img class="jesus" src="jesus.png" alt="">
  <div class="card">
    <div class="brand"><img src="../img/halleluyang.png" alt=""><span>할렐루양</span></div>
    <h1 id="title">소그룹에 초대받았어요</h1>
    <p class="sub" id="sub">함께 기도하는 소그룹이에요.<br>앱에서 초대 코드로 참여해 주세요.</p>
    <div class="code" id="codeBox"><small id="codeLabel">초대 코드</small><strong id="code">—</strong></div>
    <a class="btn primary" id="open" href="#">앱에서 열기</a>
    <a class="btn secondary" id="store" href="https://apps.apple.com/kr/app/id6812377795">App Store에서 받기</a>
    <p class="note" id="note">앱이 열리지 않으면 할렐루양 → 함께 → 소그룹 → 초대 코드로 들어가기에서 코드를 넣어 주세요.</p>
  </div>
</main>
<script>
(function () {
  var T = {
    ko: { title: '소그룹에 초대받았어요', sub: '함께 기도하는 소그룹이에요.<br>앱에서 초대 코드로 참여해 주세요.', label: '초대 코드', open: '앱에서 열기', store: 'App Store에서 받기', play: 'Google Play에서 받기',
      note: '앱이 열리지 않으면 할렐루양 → 함께 → 소그룹 → 초대 코드로 들어가기에서 코드를 넣어 주세요.', bad: '초대 코드를 확인할 수 없어요. 링크를 다시 받아 주세요.',
      pubTitle: '공개 소그룹에 함께해요', pubSub: '할렐루양에서 모임을 보고<br>바로 들어갈 수 있어요.', pubNote: '앱이 열리지 않으면 앱을 받은 뒤 이 링크를 다시 눌러 주세요.', pubBad: '모임 링크를 확인할 수 없어요. 링크를 다시 받아 주세요.' },
    en: { title: "You're invited to a prayer group", sub: 'Pray together in Halleluyang.<br>Join with the invite code in the app.', label: 'Invite code', open: 'Open in the app', store: 'Get it on the App Store', play: 'Get it on Google Play',
      note: "If the app doesn't open: Halleluyang → Together → Groups → Join with an invite code.", bad: "We couldn't read this invite code. Please ask for the link again.",
      pubTitle: 'Join a public group', pubSub: 'See the group in Halleluyang<br>and join right away.', pubNote: "If the app doesn't open, install it and tap this link again.", pubBad: "We couldn't read this group link. Please ask for the link again." },
    'zh-Hant': { title: '你被邀請加入禱告小組', sub: '在哈利路羊一起禱告。<br>請在 App 裡輸入邀請碼加入。', label: '邀請碼', open: '在 App 中開啟', store: '在 App Store 下載', play: '在 Google Play 下載',
      note: '如果 App 沒有開啟：哈利路羊 → 一起 → 小組 → 用邀請碼加入。', bad: '無法讀取這個邀請碼，請重新索取連結。',
      pubTitle: '一起加入公開小組', pubSub: '在哈利路羊看看這個小組，<br>可以直接加入。', pubNote: '如果 App 沒有開啟，請先下載再點一次這個連結。', pubBad: '無法讀取這個小組連結，請重新索取連結。' }
  };
  var langs = navigator.languages || [navigator.language || 'ko'];
  var lang = 'en';
  for (var i = 0; i < langs.length; i++) {
    var l = (langs[i] || '').toLowerCase();
    if (l.indexOf('ko') === 0) { lang = 'ko'; break; }
    if (l.indexOf('zh-hant') === 0 || l === 'zh-tw' || l === 'zh-hk' || l === 'zh-mo') { lang = 'zh-Hant'; break; }
    if (l.indexOf('en') === 0) { lang = 'en'; break; }
  }
  var t = T[lang];
  document.documentElement.lang = lang;
  document.getElementById('title').textContent = t.title;
  document.getElementById('sub').innerHTML = t.sub;
  document.getElementById('codeLabel').textContent = t.label;
  document.getElementById('open').textContent = t.open;
  document.getElementById('store').textContent = t.store;
  document.getElementById('note').textContent = t.note;

  var params = new URLSearchParams(location.search);
  var isAndroid = /android/i.test(navigator.userAgent);
  var open = document.getElementById('open');
  var deep = function (path) {
    return isAndroid ? 'intent://' + path + '#Intent;scheme=halleluyang;package=com.choiji.halleluyang;end' : 'halleluyang://' + path;
  };
  // 공개 소그룹 링크 (?g=모임 id): 코드 없이 앱의 모임 상세로
  var g = params.get('g');
  if (g !== null) {
    document.getElementById('codeBox').classList.add('hidden');
    document.getElementById('title').textContent = t.pubTitle;
    document.getElementById('sub').innerHTML = t.pubSub;
    if (/^[A-Za-z0-9_-]{1,64}$/.test(g) && !/^__.*__$/.test(g)) {
      open.href = deep('public-group/' + g);
      document.getElementById('note').textContent = t.pubNote;
    } else {
      open.classList.add('hidden');
      document.getElementById('note').textContent = t.pubBad;
    }
  }

  var raw = (params.get('c') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  var ok = /^[A-Z0-9]{6,12}$/.test(raw);
  if (g !== null) {
    // 위에서 처리
  } else if (!ok) {
    document.getElementById('codeBox').classList.add('hidden');
    open.classList.add('hidden');
    document.getElementById('note').textContent = t.bad;
  } else {
    document.getElementById('code').textContent = raw.length === 8 ? raw.slice(0, 4) + ' ' + raw.slice(4) : raw;
    open.href = deep('join/' + raw);
  }
  // 안드로이드 앱도 나왔다 — Google Play로
  if (isAndroid) {
    var store = document.getElementById('store');
    store.href = 'https://play.google.com/store/apps/details?id=com.choiji.halleluyang';
    store.textContent = t.play;
  }
})();
</script>
</body>
</html>
